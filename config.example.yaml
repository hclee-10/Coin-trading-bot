# 설정 파일. 여기 없는 값은 코드 기본값을 쓴다 — 기본값이 이미 무매도
# 적립식 실험(회당 10달러, 크로스 마진, 제한 최소화)에 맞춰져 있으므로,
# Railway CONFIG_YAML 에는 바꾸고 싶은 값만 적으면 된다.

exchange:
  id: gate                 # gate | bitget | okx
  margin_mode: cross       # 기본값 cross. 격리로 하려면 isolated
  leverage: 3

trading:
  symbols:
    - "BTC/USDT:USDT"
  timeframe: "5m"
  poll_interval_sec: 15
  quote_currency: USDT

strategy:
  name: dca_atr            # dca_atr | dca_pct | dca_channel |
                           # dca_10s | dca_1m | dca_5m | dca_15m | dca_1h | hold
  # params:
  #   spike_atr: 2.0       # dca_atr 의 급변 문턱 (ATR 배수)
  #   max_exposure_pct: 1000

risk:
  sizing_mode: tiers
  notional_tiers: [10, 10, 10, 10]   # 회당 주문 금액 (USDT).
                                     # 대시보드 설정 패널에서 바꾼 값이 우선한다.
  # 아래는 기본값과 같다 — 조이고 싶을 때만 적는다.
  # max_position_notional_pct: 1000  # 자기자본 대비 노출 상한(%)
  # max_daily_loss_pct: 100          # 일일 손실 킬스위치 (100 = 사실상 끔)
  # max_leverage: 5
  # max_open_positions: 2
  # default_stop_loss_pct: 1.0       # 전략이 손절가를 안 줄 때의 폴백
  # default_take_profit_pct: 0       # 0 = 익절 없음

logging:
  level: INFO
